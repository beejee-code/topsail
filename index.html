<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topsail — Sailing Simulator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sea"></canvas>

  <div id="hud">
    <div id="stats" class="panel">
      <div class="title">Helm</div>
      <div class="row"><span>Speed</span><b id="stat-speed">0.0 kn</b></div>
      <div class="row"><span>Heading</span><b id="stat-heading">—</b></div>
      <div class="row"><span>Point of sail</span><b id="stat-pos">—</b></div>
      <div class="row"><span>Airflow</span><b id="stat-airflow">—</b></div>
      <div class="flowbar"><div class="flowfill" id="flow-fill"></div></div>
      <div class="hint" id="stat-hint"></div>
    </div>

    <div id="wind" class="panel">
      <div class="title">Wind</div>
      <div id="wind-arrow">
        <b id="wind-speed">0</b>
        <span id="wind-unit">kn</span>
      </div>
    </div>

    <div id="controls" class="panel">
      <div class="title">Conditions &amp; Controls</div>
      <label>Wind speed
        <input id="ctrl-wspeed" type="range" min="0" max="30" step="0.5" value="12">
        <span id="ctrl-wspeed-val">12 kn</span>
      </label>
      <label>Wind direction (from)
        <input id="ctrl-wdir" type="range" min="0" max="360" step="1" value="90">
        <span id="ctrl-wdir-val">E</span>
      </label>
      <div class="btns">
        <button id="btn-tack">Tack (T)</button>
        <button id="btn-reset">Reset (R)</button>
        <button id="btn-pause">Pause (P)</button>
        <label class="check"><input id="ctrl-mouse" type="checkbox"> Mouse steer</label>
      </div>
      <div class="help">
        <span>◀ ▶ / A D — rudder</span>
        <span>▲ ▼ / W S — trim sail</span>
      </div>
    </div>

    <div id="nav-arrow">
      <div id="nav-arrow-icon">
        <div id="nav-arrow-head"></div>
        <div id="nav-arrow-shaft"></div>
      </div>
      <div id="nav-arrow-dist"></div>
    </div>

    <div id="message"></div>
  </div>

  <div id="rotate-overlay">
    <div class="rotate-inner">
      <div class="rotate-icon"></div>
      <p>Rotate your device to <b>landscape</b> to play</p>
    </div>
  </div>

  <div id="touch-controls">
    <div id="touch-tiller" class="touch-ctrl">
      <div class="touch-label">Tiller</div>
      <div class="touch-track">
        <div class="touch-thumb" id="tiller-thumb"></div>
      </div>
    </div>
    <div id="touch-actions">
      <button id="touch-tack">Tack</button>
      <button id="touch-reset">Reset</button>
    </div>
    <div id="touch-sheet" class="touch-ctrl">
      <div class="touch-label">Sheet</div>
      <div class="touch-track vertical">
        <div class="touch-thumb" id="sheet-thumb"></div>
      </div>
    </div>
  </div>

  <script src="js/physics.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
